name: CI

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  python-quality-and-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "flake8>=7,<8" "mypy>=1,<2" "pytest>=8,<9" "pytest-cov>=6,<8" "pytest-asyncio>=0.21,<1"

      - name: Lint
        run: |
          flake8 main.py src tests --select=E9,F63,F7,F82

      - name: Type check
        run: mypy src/core/interfaces.py --follow-imports=skip

      - name: Unit tests
        run: pytest tests/unit --cov=src --cov-report=term-missing

  wrapper-smoke:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Verify wrapper spec version
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\codesentinel.ps1 spec-version

      - name: Validate default config
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -ExecutionPolicy Bypass -File .\codesentinel.ps1 config-validate -ErrorFormat json
